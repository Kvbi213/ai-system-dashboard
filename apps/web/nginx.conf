server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression — zmniejszenie zużycia łącza i pamięci
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Proxy zapytań API do kontenera omnidash-api
    location /api/ {
        proxy_pass http://omnidash-api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statyczne zasoby z długim czasem pamięci podręcznej
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Obsługa routingu SPA React — zapobieganie błędom 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Zabezpieczenie przed podglądem ukrytych plików
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
