version: '3.8'

services:
  omnidash-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    depends_on:
      - omnidash-api
    restart: unless-stopped

  omnidash-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://omnidash:secret@omnidash-db:5432/omnidash
      - REDIS_URL=redis://omnidash-redis:6379
      - NODE_ENV=production
    depends_on:
      - omnidash-db
      - omnidash-redis
    restart: unless-stopped

  omnidash-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - API_GATEWAY_URL=http://omnidash-api:5000/api
      - NODE_ENV=production
    depends_on:
      - omnidash-api
      - omnidash-redis
    restart: unless-stopped

  omnidash-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omnidash
      POSTGRES_USER: omnidash
      POSTGRES_PASSWORD: secret
    volumes:
      - omnidash_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  omnidash-redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  omnidash_pgdata:
